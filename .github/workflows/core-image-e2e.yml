name: Core image e2e

# Builds the core + preinstalls images from source, runs the container smoke tests, and
# validates a real `bootc install to-disk` (composefs-native + systemd-boot — the shipping
# bootloader) by loopback-mounting the installed disk. aarch64 runner because the image is
# Apple-Silicon / Fedora Asahi only.
#
# Not covered here (needs a real Mac): the physical boot + first-boot service execution — the
# Asahi kernel-16k won't boot in generic qemu. That's the on-hardware boottest/ harness.
on:
  push:
    paths:
      - 'images/**'
      - 'deploy/**'
      - 'install/omarchy-base.packages.core'
      - 'install/helpers/fedora-first-party.sh'
      - 'install/flatpaks'
      - 'Brewfile'
      - '.github/workflows/core-image-e2e.yml'
  pull_request:
    paths:
      - 'images/**'
      - 'deploy/**'
      - 'install/omarchy-base.packages.core'
      - 'install/helpers/fedora-first-party.sh'
      - '.github/workflows/core-image-e2e.yml'
  workflow_dispatch:

concurrency:
  group: core-image-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The install wrapper's ESP copy/replace (deploy/lib/esp-backup.sh) is pure bash — no
  # container/hardware needed — so it gates on the default runner in seconds, independent of the
  # heavy image build. It proves the preboot layer (m1n1/vendorfw/asahi/ubootefi.var) survives
  # whether `bootc install` reformats the ESP or writes into it, and never clobbers systemd-boot.
  esp-backup-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ESP backup/restore e2e (deploy/omarchy-atomic-install)
        run: bash deploy/tests/esp-backup.test.sh

  e2e:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Free up runner disk (image builds + bootc install-to-disk are space-hungry)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install podman + disk tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman btrfs-progs dosfstools gdisk

      # Rootful podman throughout: `bootc install` reads the image from /var/lib/containers,
      # so the image must be built into root storage (sudo) and the scripts run under sudo.
      - name: Build core image (first-party on; bootc container lint runs in-build)
        run: sudo env ENGINE=podman WITH_FIRST_PARTY=1 ./images/build.sh core

      - name: Container smoke test (core)
        run: sudo env ENGINE=podman ./images/core/hack/smoke.sh omarchy-atomic-core:44

      # First-boot user setup e2e: preseed + run omarchy-firstboot-user in the real image, assert the
      # user is created and /etc/skel seeded the Omarchy ~/.config; best-effort finalize + unit verify
      # + hermetic provisioning tests (repo mounted since the image strips test/). The graphical
      # first-login stays hardware-only (hack/boottest/).
      - name: First-boot user e2e (firstboot-user + /etc/skel + provisioning)
        run: sudo env ENGINE=podman ./images/core/hack/first-boot.sh omarchy-atomic-core:44

      - name: bootc install to-disk (composefs + systemd-boot) + deploy assertions
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          truncate -s 20G "$RUNNER_TEMP/out/disk.raw"
          sudo podman run --rm --privileged --pid=host \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers:/var/lib/containers -v /dev:/dev \
            -v "$RUNNER_TEMP/out":/output \
            omarchy-atomic-core:44 \
            bootc install to-disk \
              --composefs-backend --bootloader systemd --filesystem btrfs \
              --generic-image --via-loopback --wipe /output/disk.raw

          # Inspect the installed disk by loopback mount (no libguestfs — its qemu appliance
          # won't launch on the arm runner). p1 = ESP (vfat), p2 = root (btrfs).
          loop=$(sudo losetup -Pf --show "$RUNNER_TEMP/out/disk.raw"); echo "loop: $loop"
          sudo mkdir -p /mnt/esp /mnt/root

          sudo mount "${loop}p1" /mnt/esp
          echo "--- ESP /EFI ---"; sudo find /mnt/esp/EFI -maxdepth 3 -print 2>/dev/null || true
          sd=false; grub=false; kern=false
          sudo test -e /mnt/esp/EFI/systemd/systemd-bootaa64.efi && sd=true
          sudo test -e /mnt/esp/EFI/BOOT/BOOTAA64.EFI && sd=true
          sudo test -e /mnt/esp/EFI/fedora/grubaa64.efi && grub=true
          sudo find /mnt/esp/EFI/Linux -name vmlinuz 2>/dev/null | grep -q . && kern=true
          sudo umount /mnt/esp

          sudo mount "${loop}p2" /mnt/root
          echo "--- deployment root ---"; sudo ls -a /mnt/root 2>/dev/null | head
          # composefs-native backend root layout: boot/ composefs/ ostree/ state/ (NOT the
          # classic /ostree/repo + /ostree/deploy + .bootc-aleph.json-at-root).
          cfs=false; ost=false; st=false
          sudo test -d /mnt/root/composefs && cfs=true
          sudo test -d /mnt/root/ostree && ost=true
          sudo test -d /mnt/root/state && st=true
          sudo umount /mnt/root; sudo losetup -d "$loop" || true

          fail=0
          $sd   && echo "OK: systemd-boot on ESP"               || { echo "FAIL: systemd-boot missing"; fail=1; }
          $grub && { echo "FAIL: grub present on ESP"; fail=1; } || echo "OK: no grub on ESP"
          $kern && echo "OK: kernel staged on ESP"              || { echo "FAIL: no kernel on ESP"; fail=1; }
          $cfs  && echo "OK: /composefs deployment store present" || { echo "FAIL: no /composefs (composefs deploy incomplete)"; fail=1; }
          $ost  && echo "OK: /ostree present"                   || { echo "FAIL: no /ostree"; fail=1; }
          $st   && echo "OK: /state present"                    || { echo "FAIL: no /state"; fail=1; }
          exit $fail

      # Real-bootc proxy for the install wrapper: `bootc install to-filesystem` onto a loopback disk
      # whose ESP is pre-populated like a real Asahi ESP. Proves esp_backup/esp_restore preserve the
      # preboot layer around an ACTUAL install, and reveals whether bootc reformats the ESP or writes
      # into it (the one thing the pure-bash esp-backup-test can only assume). to-existing-root can't
      # run here — it reimages the runner, which isn't Asahi anyway.
      - name: bootc install to-filesystem — ESP preboot preservation (real bootc)
        run: |
          rm -f "$RUNNER_TEMP/out/disk.raw"   # reclaim the to-disk artifact's space first
          # Work dir must be a REAL directory in the container image: bootc runs in the image, whose
          # /home is a symlink to /var/home (ostree), so a $RUNNER_TEMP (/home/runner/...) bind-mount
          # target can't be created inside the container. /var/tmp is a plain dir in the image.
          sudo env ENGINE=podman bash deploy/tests/esp-bootc-integration.sh \
            omarchy-atomic-core:44 /var/tmp/esp-int

      - name: Build preinstalls image
        run: sudo env ENGINE=podman ./images/build.sh preinstalls

      - name: Container smoke test (preinstalls)
        run: sudo env ENGINE=podman ./images/preinstalls/hack/smoke.sh omarchy-atomic:44

      - name: Build the on-hardware boot-test overlay (compiles the gated smoke unit)
        run: |
          sudo podman build -t omarchy-atomic-core:44-boottest \
            --build-arg BASE=omarchy-atomic-core:44 \
            -f images/core/hack/boottest/Containerfile .
