# Expose the baked Claude Chromium extension manifest to the Flatpak browser.
#
# The shipped Chromium (org.chromium.Chromium) reads external extensions from its
# Flatpak extension point under /var/lib/flatpak/extension, which is first-boot
# machine state (/var) and is not present in the read-only image. The manifest
# itself is baked immutably at /etc/omarchy/chromium-extensions (etc-files.sh);
# expose it by symlinking the extension-point DIRECTORY to that tree — Flatpak
# resolves a symlinked directory (but not a symlinked file). L+ re-asserts the
# link on every boot, so it is created once /var exists and stays correct.
L+ /var/lib/flatpak/extension/org.chromium.Chromium.Extension.omarchy - - - - /etc/omarchy/chromium-extensions
